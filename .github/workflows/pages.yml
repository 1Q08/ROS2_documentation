name: Deploy ROS 2 documentation to GitHub Pages

# 说明：本站是 multiversion 单站点（build/html/{humble,jazzy}/），
# `make multiversion` 会从 origin/humble 与 origin/jazzy 两个 ref 同时取源码构建，
# 因此任何一次部署都会重建两个版本。只需由默认分支 jazzy 触发即可；
# humble 分支上的提交会在下一次 jazzy 部署时一并生效。
# 曾把 humble 也写进触发器，但它只会：
#   1) 被随后跟进的 jazzy 运行取消（concurrency: cancel-in-progress）→ cancelled，白跑 CI；
#   2) 或独自跑到 deploy 被 github-pages 环境保护规则拒绝（仅默认分支允许部署）→ failure，站点并不更新。
# 需要手动发布时用 workflow_dispatch。
on:
  push:
    branches: [jazzy]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt

      - name: Build documentation (multiversion)
        run: make multiversion OPTS="-c . -W -jauto"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
